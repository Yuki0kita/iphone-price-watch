<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="買取1丁目の買取価格を1時間ごとに記録し、推移と他店の最高額を表示する個人用ダッシュボード。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a8242b'/%3E%3Cpath d='M6 22 L13 15 L18 19 L26 10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>買取価格ウォッチ</title>
<style>
  :root {
    --ink: #14161a;
    --muted: #63676e;
    --line: #dcdfe4;
    --bg: #ffffff;
    --soft: #f5f6f8;
    --accent: #a8242b;
    --up: #b42318;
    --down: #1f5f99;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eceef1;
      --muted: #9aa0a8;
      --line: #333840;
      --bg: #14161a;
      --soft: #1c1f25;
      --accent: #e8686f;
      --up: #f08a84;
      --down: #7fb4e0;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 760px; margin: 0 auto; padding: 28px 18px 64px; }

  header { border-bottom: 1px solid var(--line); padding-bottom: 16px; }
  h1 { font-size: 21px; margin: 0; letter-spacing: .01em; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  .picker { margin: 24px 0 0; }
  select {
    font: inherit;
    width: 100%;
    padding: 11px 12px;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .headline { margin: 22px 0 0; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .headline strong { font-size: 40px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .delta { font-size: 15px; font-weight: 700; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .target { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .target.reached { color: var(--up); font-weight: 700; }

  .deal { margin-top: 16px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .deal.go { border-color: var(--up); }
  .deal-head { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; }
  .grade {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    font-size: 13px; font-weight: 700; color: var(--bg); background: var(--muted);
  }
  .grade.s, .grade.a, .grade.b { background: var(--up); }
  .deal-flow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .deal-flow b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
  .deal-note { margin: 8px 0 0; font-size: 12px; color: var(--muted); }

  .market { margin-top: 16px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--soft); }
  .market-lead { margin: 0; font-size: 14px; }
  .market-lead b { font-variant-numeric: tabular-nums; }
  .market-lead.better { color: var(--up); font-weight: 700; }
  .quote { display: flex; gap: 10px; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .quote span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quote b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }

  .chart { margin-top: 18px; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .chart-meta { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .chart-meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
  svg { display: block; width: 100%; height: 220px; }
  svg[hidden] { display: none; }
  .chart-meta { row-gap: 4px; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .axis { fill: var(--muted); font-size: 10px; }
  .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .dot { fill: var(--accent); }
  .empty { color: var(--muted); font-size: 13px; padding: 28px 0; text-align: center; }

  h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 32px 0 0; }
  .row {
    display: flex; align-items: baseline; gap: 12px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .row:first-of-type { border-top: 1px solid var(--line); }
  .row-name { flex: 1; min-width: 0; font-size: 14px; }
  .row-price { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .row-delta { font-size: 12px; font-weight: 700; min-width: 66px; text-align: right; }

  footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
  footer p { margin: 6px 0; }
  a { color: var(--accent); }
  .error { margin-top: 24px; padding: 14px; border: 1px solid var(--up); border-radius: 10px; color: var(--up); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>買取価格ウォッチ</h1>
    <p class="sub">買取1丁目・新品状態の買取価格　<span id="checkedAt">読込中</span></p>
  </header>

  <div class="picker">
    <label class="visually-hidden" for="product" hidden>表示する商品</label>
    <select id="product" aria-label="表示する商品"></select>
  </div>

  <p class="headline"><strong id="price">—</strong><span class="delta" id="delta"></span></p>
  <p class="target" id="target" hidden></p>

  <section class="deal" id="deal" hidden>
    <p class="deal-head">
      <span class="grade" id="dealGrade">D</span>
      <span id="dealProfit"></span>
    </p>
    <div class="deal-flow" id="dealFlow"></div>
    <p class="deal-note" id="dealNote"></p>
  </section>

  <section class="market" id="market" hidden>
    <p class="market-lead" id="marketLead"></p>
    <div id="marketQuotes"></div>
  </section>

  <section class="chart" aria-label="価格推移">
    <div class="chart-meta">
      <span>30日高値 <b id="high">—</b></span>
      <span>30日安値 <b id="low">—</b></span>
      <span>記録 <b id="points">—</b></span>
    </div>
    <svg id="chart" role="img" aria-label="30日間の価格推移グラフ"></svg>
    <p class="empty" id="chartEmpty" hidden>記録が2点以上たまるとグラフを表示します。</p>
  </section>

  <h2>すべての監視商品</h2>
  <div id="rows"></div>

  <footer>
    <p>1時間ごとに自動取得。価格は取得時点の参考値です。状態・付属品・保証期間・購入証明などの条件で実際の査定額は変わります。</p>
    <p id="warning" hidden></p>
  </footer>
</main>

<script>
const WINDOW_DAYS = 30;
const SVG_NS = 'http://www.w3.org/2000/svg';

const yen = n => n == null ? '—' : '¥' + Number(n).toLocaleString('ja-JP');
const signedYen = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + '¥' + Math.abs(n).toLocaleString('ja-JP');
const when = t => new Date(t).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const el = id => document.getElementById(id);

const MARKET_QUOTES_SHOWN = 3;
const GRID_LINES = 4;

/** 目盛り間隔を 1/2/2.5/5×10^n のいずれかに丸める。 */
function niceStep(range, targetLines) {
  const raw = Math.max(range, 1) / targetLines;
  const magnitude = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5]) {
    if (raw <= m * magnitude) return m * magnitude;
  }
  return 10 * magnitude;
}

let series = {};
let targets = {};
let market = {};
let retail = {};

function groupByProduct(history) {
  const grouped = {};
  for (const row of history) {
    if (row.ok === false) continue;
    (grouped[row.product_id] ||= []).push(row);
  }
  for (const rows of Object.values(grouped)) {
    rows.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  }
  return grouped;
}

function withinWindow(rows) {
  const cutoff = Date.now() - WINDOW_DAYS * 86400000;
  return rows.filter(r => new Date(r.timestamp).getTime() >= cutoff);
}

function changeFromPrevious(rows) {
  return rows.length < 2 ? null : rows.at(-1).price - rows.at(-2).price;
}

function applyDelta(node, diff) {
  node.className = 'delta ' + (diff > 0 ? 'up' : diff < 0 ? 'down' : '');
  node.textContent = !diff ? '' : `前回比 ${signedYen(diff)}`;
}

function drawChart(rows) {
  const svg = el('chart');
  svg.innerHTML = '';
  const data = withinWindow(rows);
  const empty = data.length < 2;
  el('chartEmpty').hidden = !empty;
  // SVGElementには hidden プロパティがないため、属性で切り替える。
  svg.toggleAttribute('hidden', empty);
  if (empty) return;

  // 実寸で描く。viewBoxを引き伸ばすと線幅と点が横方向に潰れるため。
  const H = 220, PAD_R = 12, PAD_T = 12, PAD_B = 26;
  const W = Math.max(svg.clientWidth || svg.parentElement.clientWidth, 280);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const prices = data.map(d => d.price);
  let min = Math.min(...prices), max = Math.max(...prices);
  if (min === max) { min -= 2000; max += 2000; }
  const headroom = (max - min) * 0.15;
  min -= headroom; max += headroom;

  // 目盛りはきりのいい間隔（1/2/2.5/5×10^n）に丸める。端数や重複したラベルを出さないため。
  const gridStep = niceStep(max - min, GRID_LINES);
  const axisLabel = v => (gridStep >= 1000 ? Math.round(v / 1000) + 'k' : Math.round(v).toLocaleString('ja-JP'));
  const PAD_L = gridStep >= 1000 ? 52 : 64;

  const t0 = new Date(data[0].timestamp).getTime();
  const span = Math.max(new Date(data.at(-1).timestamp).getTime() - t0, 1);
  const x = t => PAD_L + (new Date(t).getTime() - t0) / span * (W - PAD_L - PAD_R);
  const y = p => PAD_T + (max - p) / (max - min) * (H - PAD_T - PAD_B);

  const add = (tag, attrs, text) => {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (text != null) node.textContent = text;
    svg.appendChild(node);
  };

  for (let v = Math.ceil(min / gridStep) * gridStep; v <= max; v += gridStep) {
    const gy = y(v);
    add('line', { x1: PAD_L, x2: W - PAD_R, y1: gy, y2: gy, class: 'grid' });
    add('text', { x: PAD_L - 8, y: gy + 3, 'text-anchor': 'end', class: 'axis' }, axisLabel(v));
  }

  add('polyline', { points: data.map(d => `${x(d.timestamp)},${y(d.price)}`).join(' '), class: 'line' });
  for (const d of data) add('circle', { cx: x(d.timestamp), cy: y(d.price), r: 2.6, class: 'dot' });

  const dayLabel = t => when(t).split(' ')[0];
  add('text', { x: PAD_L, y: H - 8, class: 'axis' }, dayLabel(data[0].timestamp));
  add('text', { x: W - PAD_R, y: H - 8, 'text-anchor': 'end', class: 'axis' }, dayLabel(data.at(-1).timestamp));
}

const GO_GRADES = new Set(['S', 'A', 'B']);

function showDeal(productId) {
  const deal = retail[productId];
  const box = el('deal');
  box.hidden = !deal;
  if (!deal) return;

  const go = GO_GRADES.has(deal.grade);
  box.className = 'deal' + (go ? ' go' : '');
  el('dealGrade').textContent = deal.grade;
  el('dealGrade').className = 'grade ' + deal.grade.toLowerCase();
  el('dealProfit').textContent = deal.safe_profit >= 0
    ? `安全利益 ${yen(deal.safe_profit)}`
    : `逆ザヤ ${yen(-deal.safe_profit)}`;

  el('dealFlow').innerHTML =
    `<span>仕入 <b>${yen(deal.price)}</b></span>` +
    `<span>→ 買取 <b>${yen(deal.buyback_price)}</b></span>` +
    `<span>上限 <b>${yen(deal.buy_threshold)}</b></span>`;

  const where = deal.store ? `${deal.store}${deal.in_stock ? '' : '（在庫なし）'}` : '';
  el('dealNote').textContent = `${where}｜査定減額と経費を引いた後の金額です。`;
}

function showMarket(productId, shopPrice) {
  const entry = market[productId];
  const box = el('market');
  box.hidden = !entry;
  if (!entry) return;

  const gap = entry.max_price - shopPrice;
  const lead = el('marketLead');
  lead.className = 'market-lead' + (gap > 0 ? ' better' : '');
  // 店名は直下の一覧の1行目に出るため、ここでは繰り返さない。
  lead.innerHTML = gap > 0
    ? `他店最高 <b>${yen(entry.max_price)}</b>　買取1丁目より ${signedYen(gap)}`
    : gap === 0 ? `他店最高 <b>${yen(entry.max_price)}</b>　買取1丁目と同額`
    : `買取1丁目が最高値`;

  const list = el('marketQuotes');
  list.innerHTML = '';
  for (const q of (entry.quotes || []).slice(0, MARKET_QUOTES_SHOWN)) {
    const row = document.createElement('div');
    row.className = 'quote';
    const store = document.createElement('span');
    store.textContent = q.store;
    const price = document.createElement('b');
    price.textContent = yen(q.price);
    row.append(store, price);
    list.appendChild(row);
  }
}

function showProduct(productId) {
  const rows = series[productId];
  if (!rows) return;
  const latest = rows.at(-1);
  const recent = withinWindow(rows);

  el('price').textContent = yen(latest.price);
  applyDelta(el('delta'), changeFromPrevious(rows));

  const target = targets[productId];
  const targetNode = el('target');
  targetNode.hidden = target == null;
  if (target != null) {
    // 実際に受け取れるのは一番高い店の価格なので、そちらで到達を判定する。
    const best = Math.max(latest.price, market[productId]?.max_price ?? 0);
    const reached = best >= target;
    targetNode.className = 'target' + (reached ? ' reached' : '');
    targetNode.textContent = reached
      ? `目標 ${yen(target)} に到達`
      : `目標 ${yen(target)} まで あと ${yen(target - best)}`;
  }

  showDeal(productId);
  showMarket(productId, latest.price);
  el('high').textContent = yen(Math.max(...recent.map(r => r.price)));
  el('low').textContent = yen(Math.min(...recent.map(r => r.price)));
  el('points').textContent = recent.length + '点';
  drawChart(rows);
}

function renderRows() {
  const box = el('rows');
  box.innerHTML = '';
  const entries = Object.entries(series).sort((a, b) => b[1].at(-1).price - a[1].at(-1).price);
  for (const [, rows] of entries) {
    const latest = rows.at(-1);
    const diff = changeFromPrevious(rows);
    const row = document.createElement('div');
    row.className = 'row';
    const name = document.createElement('span');
    name.className = 'row-name';
    name.textContent = latest.product_name;
    const price = document.createElement('span');
    price.className = 'row-price';
    price.textContent = yen(latest.price);
    const delta = document.createElement('span');
    delta.className = 'row-delta ' + (diff > 0 ? 'up' : diff < 0 ? 'down' : '');
    delta.textContent = diff == null || diff === 0 ? '' : signedYen(diff);
    row.append(name, price, delta);
    box.appendChild(row);
  }
}

async function init() {
  try {
    const bust = '?t=' + Date.now();
    const load = (name, fallback) =>
      fetch(`./data/${name}.json${bust}`).then(r => (r.ok ? r.json() : fallback)).catch(() => fallback);
    const [history, status, marketData, retailData] = await Promise.all([
      load('history', []),
      load('status', {}),
      // APIキー未設定なら market.json / retail.json は存在しない。無くても他は動く。
      load('market', { products: {} }),
      load('retail', { products: {} }),
    ]);

    market = marketData.products || {};
    retail = retailData.products || {};
    series = groupByProduct(history);
    targets = Object.fromEntries((status.products || []).map(p => [p.id, p.target_price]));
    el('checkedAt').textContent = status.checked_at ? `最終チェック ${when(status.checked_at)}` : '';

    if (!Object.keys(series).length) {
      el('chartEmpty').hidden = false;
      el('chartEmpty').textContent = 'まだ記録がありません。最初の自動取得を待っています。';
      el('chart').toggleAttribute('hidden', true);
      return;
    }

    // 設定ファイルの並び順に合わせる。先頭の機種が最初に表示される。
    const select = el('product');
    const configured = (status.products || []).map(p => p.id).filter(id => series[id]);
    const ordered = [...configured, ...Object.keys(series).filter(id => !configured.includes(id))];
    for (const id of ordered) {
      select.append(new Option(series[id].at(-1).product_name, id));
    }
    select.addEventListener('change', () => showProduct(select.value));

    // 画面幅が変わったらグラフを描き直す（実寸で描いているため）。
    let redrawTimer;
    window.addEventListener('resize', () => {
      clearTimeout(redrawTimer);
      redrawTimer = setTimeout(() => drawChart(series[select.value] || []), 120);
    });

    showProduct(select.value);
    renderRows();

    const notes = [];
    if (status.errors && status.errors.length) {
      notes.push(`直近の取得で${status.errors.length}件のエラーがありました。`);
    }
    // 買取1丁目が扱っていない商品は、買取Xと連携するまで記録が始まらない。
    const pending = (status.products || []).filter(p => !series[p.id]);
    if (pending.length) {
      notes.push(`未取得 ${pending.length}件（${pending.map(p => p.name).join('、')}）。買取XのAPIキー登録後に記録が始まります。`);
    }
    if (notes.length) {
      const warning = el('warning');
      warning.hidden = false;
      warning.textContent = notes.join(' ');
    }
  } catch (e) {
    document.querySelector('main').insertAdjacentHTML(
      'beforeend', `<p class="error">データを読み込めませんでした: ${e.message}</p>`);
  }
}

init();
</script>
</body>
</html>
