name: iPhone price watch

on:
  workflow_dispatch:
  schedule:
    # 毎時17分。毎時00分付近はGitHub Actionsが混みやすく遅延するため、ずらしている。
    - cron: '17 * * * *'

# 既定は権限なし。書き込みはデータをコミットするジョブだけに付ける。
permissions: {}

concurrency:
  group: iphone-price-watch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Collect prices and notify
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          KTX_API_KEY: ${{ secrets.KTX_API_KEY }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
        run: python -m src.collector

      - name: Commit changed data
        run: |
          if git diff --quiet -- docs/data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "price-watch-bot"
          git config user.email "price-watch-bot@users.noreply.github.com"
          git add docs/data
          git commit -m "chore: update iPhone prices"
          # 手動実行と定期実行が近接した場合に備えて、押し戻されたら取り込んでから再送する。
          git pull --rebase --autostash
          git push
